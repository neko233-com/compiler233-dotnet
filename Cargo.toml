[package]
name = "compiler233-dotnet"
version = "0.1.0"
edition = "2024"
description = "A Rust .NET compiler project targeting Roslyn compatibility and performance"
license = "MIT"

[dependencies]
hao = "0.0.9"
serde_json = "1"
sha2 = "0.10"
tempfile = "3"
tree-sitter = "0.25"
tree-sitter-c-sharp = "0.23.5"

[profile.release]
lto = "thin"
codegen-units = 1
